apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-app
  namespace: bluegreen
  labels:
    app: green-app
    environment: green
spec:
  replicas: 2

  selector:
    matchLabels:
      app: green-app
      environment: green

  template:
    metadata:
      labels:
        app: green-app
        environment: green

    spec:
      containers:
        - name: bluegreen-app
          image: ghcr.io/uchendu130617/bluegreen-app:c74062581b852b3a2105d6753470ac2f1fda7393

          ports:
            - containerPort: 3000

          env:
            - name: ENVIRONMENT
              value: "GREEN"

            - name: SERVER_NAME
              value: "green-server"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
